# Local dev stack — Postgres+pgvector, MinIO, and the engine.
# Gives parity with the Linux deploy target (PREREQUISITES §2).
# Bring up:  docker compose -f deploy/docker-compose.yml up -d
# Env comes from the repo-root .env (see .env.example).
#
# ⚠️ STALE-IMAGE GUARD (do NOT skip before shipping). Docker's COPY layer cache has bitten this repo:
# `engine`/`migrate`/`worker` images can ship code OLDER than the working tree (a migrate container once
# ran without migrations 0011/0012). Plain `up -d` reuses those cached layers. So on ANY code change,
# rebuild WITHOUT cache before deploying:
#     docker compose -f deploy/docker-compose.yml build --no-cache engine migrate worker worker-backfill
#     docker compose -f deploy/docker-compose.yml up -d
# Use scripts/deploy_rebuild.sh (which does exactly this) rather than a bare `up`.

name: adaptive-intake

services:
  db:
    image: pgvector/pgvector:pg16
    # The container superuser is `intake_admin` (migrations/bootstrap). The least-privilege
    # runtime role `app_rw` is created by Alembic migration 0001 (NOSUPERUSER, NOBYPASSRLS)
    # so RLS is enforced against the engine. See engine/app/config.py for the rationale.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adaptive_intake}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-intake_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-change_me_admin_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-intake_admin} -d ${POSTGRES_DB:-adaptive_intake}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change_me_local_only}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot DB init (F7): applies Alembic migrations + the Procrastinate schema/grants as the
  # intake_admin superuser BEFORE the engine serves, so `docker compose up` can never start the
  # engine against an unmigrated DB (where app_rw/the trust-spine tables don't yet exist).
  # Idempotent — runs on every boot, a no-op once at head.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.init_db
    restart: "no"

  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      # Inside the compose network, reach services by name, not localhost.
      POSTGRES_HOST: db
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Heavy deps (OCR/report/embed) are baked into the image so the Windows host stays clean.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # The Procrastinate worker — what actually FIRES the queued pipeline stages (normalise → extract)
  # and the periodic promote-scan, so intake flows end-to-end with no manual trigger. Runs the async
  # `app.queue.app` (async connector required for a worker; the engine's sync in-transaction defer
  # still works through it via get_sync_connector — see queue.py). Reaches the host's Ollama (the
  # 4070, $0) via host.docker.internal — extraction runs on the host GPU, not in-container.
  # Listens to the DEFAULT queue only (intake + promote-scan); backfill is isolated below so a long
  # re-extraction drain can never starve live intake (queue.py BACKFILL_QUEUE).
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: db
      MINIO_ENDPOINT: http://minio:9000
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # --schedule: this intake worker also runs the promote-scan scheduler loop (replaces @app.periodic).
    # Ollama serialises per-model and qwen3:14b fills ~10GB of the 12GB card, so one extraction at a time.
    command: python /app/scripts/run_worker.py default --schedule
    restart: unless-stopped

  # The low-priority backfill worker — drains promoted-concept re-extraction in bounded batches on its
  # own queue, so it never blocks the intake worker above (STAGE-6, CLAUDE.md §4).
  worker-backfill:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: db
      MINIO_ENDPOINT: http://minio:9000
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python /app/scripts/run_worker.py backfill
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
