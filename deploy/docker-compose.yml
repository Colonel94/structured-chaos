# Local dev stack — Postgres+pgvector, MinIO, and the engine.
# Gives parity with the Linux deploy target (PREREQUISITES §2).
# Bring up:  docker compose -f deploy/docker-compose.yml up -d
# Env comes from the repo-root .env (see .env.example).

name: adaptive-intake

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adaptive_intake}
      POSTGRES_USER: ${POSTGRES_USER:-app_rw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_rw} -d ${POSTGRES_DB:-adaptive_intake}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change_me_local_only}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      # Inside the compose network, reach services by name, not localhost.
      POSTGRES_HOST: db
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Heavy deps (OCR/report/embed) are baked into the image so the Windows host stays clean.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
  miniodata:
