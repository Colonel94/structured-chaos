# Universal default priority / SLA / routing policy (Phase 6, EDD §8 + §16.2).
#
# This ships with the product so a zero-config tenant gets a correct, deterministic SLA with NO input
# (winning-condition §2 setup gate). A tenant's own `policy_yaml` (optional) REPLACES this wholesale —
# it is refinement, never a setup gate. Service levels are this engine's output, never a model's.
#
# Evaluation is FIRST-MATCH-WINS over `rules`, top to bottom: the first rule whose `when` conditions ALL
# hold decides the case, and that single rule is the one-sentence explanation. So order = precedence.
# A `when` condition lists the allowed values for an input; an omitted input key is a wildcard. Inputs
# come from the governed core: `severity` = severity_signal, `category` = category, `emotion` =
# emotion_signal. The final rule MUST be a catch-all ({}) so evaluation is total (every case gets a
# decision). `sla_hours` sets the response deadline, measured from first_contact_at (the clock starts at
# first contact, not at completeness — CLAUDE.md §3).
version: default-v3  # v3 (2026-08-23): sentiment TRAJECTORY — route on the conversation's peak emotion + an escalating-trend rule (best practice: track sentiment over the interaction, act on escalation early). v2: category routing (delivery/product/service/staff/access)

rules:
  # --- Severity dominates: a checkable state (safety, a vulnerable party) beats arguable conduct. ---
  - id: safety-critical
    when: { severity: [safety_health] }
    priority: P1
    routing: safety_escalation
    sla_hours: 1
    rationale: "Safety or health risk flagged — urgent, routed to safety escalation."

  - id: vulnerable-party
    when: { severity: [vulnerable_party] }
    priority: P1
    routing: priority_support
    sla_hours: 2
    rationale: "A vulnerable party is involved — urgent, routed to priority support."

  # --- Emotion escalates: an angry customer is a churn/reputation risk; get a human on it fast (§5). ---
  - id: angry-financial-harm
    when: { severity: [financial_harm], emotion: [angry] }
    priority: P1
    routing: priority_support
    sla_hours: 2
    rationale: "Financial harm reported by an angry customer — urgent, routed to priority support."

  - id: financial-harm
    when: { severity: [financial_harm] }
    priority: P2
    routing: finance_billing
    sla_hours: 4
    rationale: "Financial harm reported — high priority, routed to finance/billing."

  - id: privacy-security-severity
    when: { severity: [privacy_security] }
    priority: P2
    routing: fraud_security
    sla_hours: 4
    rationale: "Identity, account-security, or privacy exposure — high priority, routed to the fraud and security team."

  - id: angry-any
    when: { emotion: [angry] }
    priority: P2
    routing: human_review
    sla_hours: 4
    rationale: "An angry customer — high priority, routed to a human reviewer."

  # Escalation caught EARLY: a customer whose sentiment is rising across the conversation (calm→frustrated,
  # frustrated→angry) is a churn/reputation risk before they hit full anger — get a human on it (best
  # practice: act on escalation, don't wait for the peak). `emotion` above is the conversation PEAK, so a
  # steady-angry case already routed via angry-any; this adds the RISING-frustration case. Single-turn
  # cases have trend 'single' and never match — so the eval set is unaffected.
  - id: escalating-sentiment
    when: { emotion_trend: [escalating] }
    priority: P2
    routing: human_review
    sla_hours: 4
    rationale: "The customer's frustration is escalating across the conversation — routed to a human reviewer."

  # --- A safety/health complaint that severity did not already flag still escalates on the category. ---
  - id: safety-category
    when: { category: [safety_health] }
    priority: P1
    routing: safety_escalation
    sla_hours: 2
    rationale: "A safety or health complaint — urgent, routed to safety escalation."

  # --- Money/record disputes route to finance; conduct/product/delivery take the standard path. ---
  - id: billing-or-record
    when: { category: [billing_charge, record_accuracy] }
    priority: P2
    routing: finance_billing
    sla_hours: 8
    rationale: "A billing or record-accuracy dispute — high priority, routed to finance/billing."

  # --- Not yet classifiable → triage for clarification rather than a wrong deadline (refuse to guess). ---
  - id: unclear
    when: { category: [UNCLEAR] }
    priority: P3
    routing: triage
    sla_hours: 12
    rationale: "The complaint is not yet clear — routed to triage for clarification."

  # --- Category routing: a known complaint type goes to the team that owns it, not a general queue. ---
  # Priority stays standard (severity/emotion above already escalate); the WIN is a meaningful owner and
  # a one-sentence reason instead of "a standard complaint". Universal archetypes, no per-tenant config.
  - id: delivery
    when: { category: [delivery_fulfilment] }
    priority: P3
    routing: fulfilment
    sla_hours: 12
    rationale: "A delivery or fulfilment issue — routed to the fulfilment team."

  - id: product
    when: { category: [product_fault] }
    priority: P3
    routing: returns_quality
    sla_hours: 12
    rationale: "A product fault — routed to returns and quality."

  - id: service
    when: { category: [service_fault] }
    priority: P3
    routing: customer_care
    sla_hours: 12
    rationale: "A service or handling complaint — routed to customer care."

  - id: staff-conduct
    when: { category: [staff_conduct] }
    priority: P3
    routing: people_conduct
    sla_hours: 12
    rationale: "A staff-conduct complaint — routed to the people and conduct team."

  - id: access
    when: { category: [access_availability] }
    priority: P3
    routing: operations
    sla_hours: 12
    rationale: "An access or availability issue — routed to operations."

  - id: transaction-processing
    when: { category: [transaction_processing] }
    priority: P3
    routing: finance_billing
    sla_hours: 12
    rationale: "A payment or transaction-processing failure — routed to finance/billing."

  - id: fraud-security
    when: { category: [fraud_security] }
    priority: P2
    routing: fraud_security
    sla_hours: 4
    rationale: "A fraud, scam, or account-security complaint — high priority, routed to the fraud and security team."

  - id: privacy-data
    when: { category: [privacy_data] }
    priority: P2
    routing: privacy_compliance
    sla_hours: 8
    rationale: "A privacy or personal-data complaint — routed to privacy and compliance."

  - id: misleading-practice
    when: { category: [misleading_practice] }
    priority: P3
    routing: customer_care
    sla_hours: 12
    rationale: "A misleading-practice or bait-and-switch complaint — routed to customer care."

  # --- Catch-all: an uncategorised complaint (category 'other' or absent). MUST be last + unconditional. ---
  - id: default
    when: {}
    priority: P3
    routing: general_queue
    sla_hours: 24
    rationale: "A general complaint — normal priority, routed to the general queue."
