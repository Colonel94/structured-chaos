<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Contact us</title>
    <style>
      html, body { margin: 0; background: #f4f6f8; min-height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 24px 14px 48px; color: #14171c;
      }
      .head { max-width: 560px; margin: 8px auto 18px; text-align: center; }
      .head h1 { font-size: 20px; margin: 0 0 4px; }
      .head p { font-size: 14px; color: #5b6470; margin: 0; }
      noscript { display: block; max-width: 560px; margin: 20px auto; padding: 14px;
        background: #fff4e5; color: #9a5b00; border-radius: 10px; font-size: 14px; text-align: center; }
    </style>
  </head>
  <body>
    <div class="head">
      <h1>__HEAD_TITLE__</h1>
      <p>__HEAD_SUB__</p>
    </div>
    <noscript>
      This page needs JavaScript to submit your case. Please enable it, or email us instead.
    </noscript>
    <script>
      // The router substitutes __MODE__ (submit|status) and __VALUE__ (the embed key or the case token).
      window.__ADAPTIVE_PORTAL__ = {
        mode: "__MODE__",
        value: "__VALUE__",
        api: location.origin + "/p",
        accent: "#2563eb",
      };
    </script>
    <script src="/p/embed.js"></script>
  </body>
