# Alembic config for the trust-spine schema.
# Run from the engine/ dir:  uv run --project . alembic upgrade head
# The DB URL is injected from app.config (admin/superuser role) in migrations/env.py —
# it is NOT hard-coded here, so it never carries a password into the repo.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
