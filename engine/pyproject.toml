[project]
name = "adaptive-intake-engine"
version = "0.0.0"
description = "Adaptive Intake — headless extraction engine (local-first PoC on the 4070)"
requires-python = ">=3.12"

# --- Core (host-safe: pure-python / wheels; a `uv sync` of this is fast) ---
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "anthropic>=0.40",       # Claude Haiku extraction backend
    "cohere>=5.13",          # Transcribe Arabic ASR backend
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "boto3>=1.35",           # MinIO/S3 blob store (S3 API)
    "procrastinate>=3.0",    # transactional task queue (Phase 2)
    "python-multipart>=0.0.9",
]

# --- uv dependency groups. Heavy/Windows-hostile deps are CONTAINER-ONLY
#     (PREREQUISITES §3: never install PaddleOCR/WeasyPrint on the Windows host). ---
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "types-pyyaml",
    "openpyxl>=3.1",                                    # read the holdout labelling workbook (.xlsx) → CSV; MIT
]
embed = ["FlagEmbedding>=1.3"]                       # BGE-M3 (pulls torch) — CPU-capable
asr = [
    "faster-whisper>=1.0",                                # Gulf-Arabic ASR (CTranslate2). MIT. CPU-capable.
    "nvidia-cublas-cu12; sys_platform == 'win32'",        # CUDA 12 runtime for GPU on the Windows-host 4070
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",  # (scripts/cuda_win.py colocates the DLLs so CT2 finds them)
]
ocr   = ["paddleocr>=3.7,<4", "paddlepaddle>=3,<4"]  # container-only. Arabic=arabic_PP-OCRv3_mobile_rec via lang="ar"+ocr_version="PP-OCRv3"; needs FLAGS_use_mkldnn=0 (paddle-3.x PIR/oneDNN bug)
pdf   = ["pdfplumber>=0.11", "pypdfium2>=4.30"]      # pypdfium2, NOT PyMuPDF (AGPL)
vad   = ["silero-vad>=5.1"]                          # pin + verify licence on version (§3)
report = ["weasyprint>=63.0"]                        # container-only (GTK/Pango)

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
