name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync core + dev (heavy groups are container-only)
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check .
      - name: Black (check)
        run: uv run black --check .
      - name: Mypy
        run: uv run mypy app
      - name: Pytest
        # REQUIRE_DB makes the DB-backed trust suite a hard failure if the container can't start —
        # the trust spine must never silently skip to green in CI (CLAUDE.md §6a).
        env:
          REQUIRE_DB: "1"
        run: uv run pytest -q

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
